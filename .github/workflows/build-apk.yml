name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build web app
        working-directory: client
        run: npm run build

      - name: Initialize Capacitor Android
        working-directory: client
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: client
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: client/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: timebox-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: client/android/app/build/outputs/apk/debug/app-debug.apk
          name: TimeBox ${{ github.ref_name }}
          body: |
            ## TimeBox ${{ github.ref_name }}
            
            Download the APK and install on your Android device.
            
            ### Installation
            1. Download `app-debug.apk`
            2. On your phone, go to Settings > Security > Allow installation from unknown sources
            3. Open the APK file and install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
