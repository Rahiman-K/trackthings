services:
  - type: web
    name: trackthings
    runtime: node
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://trackthings.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://trackthings.onrender.com/api/google/callback
